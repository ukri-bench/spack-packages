name: Build nemo

on:
  push:
    branches: [main]
    paths: &paths
      - spack_pkgs/spack_repo/ukri_bench/packages/nemo/**
      - spack_pkgs/spack_repo/ukri_bench/repo.yaml
      - .github/workflows/build-package.yml
      - .github/workflows/build-nemo.yml
  pull_request:
    paths: *paths
  schedule:
    # Weekly, to catch breakage from new Spack and spack-packages versions
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-package.yml
    with:
      package: nemo
      spec: nemo
      smoke-test: |
        test -e "${PREFIX}/EXP00/nemo.exe"
        "${PREFIX}/bin/nemo-wrapper" --help
