name: Build bench-dolfinx

on:
  push:
    branches: [main]
    paths: &paths
      - spack_pkgs/spack_repo/ukri_bench/packages/bench_dolfinx/**
      - spack_pkgs/spack_repo/ukri_bench/packages/fenics_dolfinx/**
      - spack_pkgs/spack_repo/ukri_bench/packages/mesa/**
      - spack_pkgs/spack_repo/ukri_bench/repo.yaml
      - .github/workflows/build-package.yml
      - .github/spack/**
      - .github/workflows/build-bench-dolfinx.yml
  pull_request:
    paths: *paths
  schedule:
    # Weekly, to catch upstream breakage (e.g. source downloads)
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Cancel superseded pull request runs; pushes to main finish so they populate the cache
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        # Spack picks 0.10.0 for a plain `bench-dolfinx`, so main is listed
        # explicitly
        spec: ["bench-dolfinx@main", "bench-dolfinx@0.10.0"]
    permissions:
      contents: read
      packages: write # push to the OCI build cache
    uses: ./.github/workflows/build-package.yml
    with:
      package: bench-dolfinx
      spec: ${{ matrix.spec }}
      executable: bin/bench_dolfinx
      smoke-test: |
        # On CPU, the benchmark defaults to (and only supports) qmode=0
        "${VIEW}/bin/mpiexec" -n 2 "${PREFIX}/bin/bench_dolfinx" --ndofs=10000 --degree=3 --nreps=10

  # Starts after the CPU build, which caches the (large) dependency stack the GPU
  # builds share. Compile-only: runners have no GPU, so only the executable check
  # runs. Keep the specs in sync with ci.yml.
  gpu:
    needs: cpu
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        spec:
          # CUDA resolves to 13.x (gcc 15 conflicts with cuda@:12.9); builtin
          # fenics-basix@0.10 applies the mdspan patch CUDA 13 needs.
          # The CUDA runfile installer needs libxml2.so.2.
          - bench-dolfinx +cuda cuda_arch=90 ^cuda %libxml2@:2.13 +shared
          # hip needs gl. mesa +llvm (the default) builds against the newest
          # llvm, which mesa@25.0 does not support; softpipe is enough here.
          - bench-dolfinx +rocm amdgpu_target=gfx90a ^mesa~llvm
    permissions:
      contents: read
      packages: write # push to the OCI build cache
    uses: ./.github/workflows/build-package.yml
    with:
      package: bench-dolfinx
      spec: ${{ matrix.spec }}
      executable: bin/bench_dolfinx
