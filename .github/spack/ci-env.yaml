# Spack environment template for the package build workflows.
# Specs are added by .github/workflows/build-package.yml.
spack:
  include:
    - concretizer.yaml
    - packages.yaml
  view: /opt/view
  config:
    install_tree:
      root: /opt/spack
      # Padding lets cached binaries be relocated to longer install paths
      padded_length: 128
    build_stage:
      - /opt/spack-stage

  mirrors:
    ukri-bench-buildcache:
      url: oci://ghcr.io/ukri-bench/spack-packages-buildcache
      binary: true
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
