name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  spack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load Spack versions
        run: grep -E '^[A-Z_]+=' .github/spack/versions.env >> "${GITHUB_ENV}"
      - name: Set up Spack
        uses: spack/setup-spack@16b756799ede8b28951287f89bcd3fdb32ec1ca3 # v3.0.0
        with:
          spack_ref: ${{ env.SPACK_VERSION }}
          packages_ref: ${{ env.SPACK_PACKAGES_COMMIT }}
          buildcache: false
      - name: Audit and concretize
        run: |
          spack repo add "${GITHUB_WORKSPACE}/spack_pkgs/spack_repo/ukri_bench"
          # fenics-dolfinx and mesa are builtin packages plus a patch; audit only our own
          spack audit packages bench-dolfinx nemo
          # Concretize with the build workflows' concretizer settings and package requirements
          spec() { spack -C .github/spack spec "$@"; }
          set -x
          spec bench-dolfinx
          spec bench-dolfinx@main
          # GPU specs: keep in sync with build-bench-dolfinx.yml
          spec bench-dolfinx +cuda cuda_arch=90
          spec bench-dolfinx +rocm amdgpu_target=gfx90a
          spec bench-dolfinx@main +cuda cuda_arch=90
          spec bench-dolfinx@main +rocm amdgpu_target=gfx90a
          spec benchmark-flamegpu +cuda cuda_arch=90
          spec benchmark-flamegpu +rocm amdgpu_target=gfx90a
          spec benchmark-flamegpu@main +cuda cuda_arch=90
          spec benchmark-flamegpu@main +rocm amdgpu_target=gfx90a
          spec nemo
          spec nemo config=BENCH +ice +pisces
          spec nemo ~mpi
          spec nemo +openmp
          spec nemo +openmp +openmp_offload openmp_flags=-fopenmp
          # Unsupported combinations must be rejected
          for s in "bench-dolfinx +cuda +rocm cuda_arch=90 amdgpu_target=gfx90a" \
              "bench-dolfinx +cuda" "nemo +openmp +openmp_offload" "nemo config=GENERIC"; do
            # shellcheck disable=SC2086
            if spec ${s}; then echo "::error::${s} should be rejected"; exit 1; fi
          done
