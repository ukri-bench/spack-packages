name: Build nemo

on:
  push:
    branches: [main]
    paths: &paths
      - spack_pkgs/spack_repo/ukri_bench/packages/nemo/**
      - spack_pkgs/spack_repo/ukri_bench/repo.yaml
      - .github/workflows/build-package.yml
      - .github/spack/**
      - .github/workflows/build-nemo.yml
  pull_request:
    paths: *paths
  schedule:
    # Weekly, to catch upstream breakage (e.g. source downloads)
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Cancel superseded pull request runs; pushes to main finish so they populate the cache
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write # push to the OCI build cache
    uses: ./.github/workflows/build-package.yml
    with:
      package: nemo
      spec: nemo
      smoke-test: |
        test -e "${PREFIX}/EXP00/nemo.exe"
        "${PREFIX}/bin/nemo-wrapper" --help
