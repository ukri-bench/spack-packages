name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check workflows
        # actionlint also runs shellcheck (preinstalled on the runner) on run: scripts
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  spack:
    runs-on: ubuntu-26.04
    # Same image as the build workflows, so specs concretize with the same
    # compilers (e.g. gcc 15 selects CUDA 13)
    container: ubuntu:26.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Spack requirements
        run: |
          apt-get -y update
          apt-get install -y --no-install-recommends file bzip2 ca-certificates g++ gcc gfortran git gzip \
            lsb-release patch python3 tar unzip xz-utils zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load Spack versions
        run: grep -E '^[A-Z_]+=' .github/spack/versions.env >> "${GITHUB_ENV}"

      - name: Set up Spack
        uses: spack/setup-spack@16b756799ede8b28951287f89bcd3fdb32ec1ca3 # v3.0.0
        with:
          spack_ref: ${{ env.SPACK_VERSION }}
          packages_ref: ${{ env.SPACK_PACKAGES_COMMIT }}
          buildcache: false

      - name: Add package repository
        run: |
          spack repo add "${GITHUB_WORKSPACE}/spack_pkgs/spack_repo/ukri_bench"
          # Packages written here, not overrides of builtin packages
          pkgs=$(spack python .github/scripts/repo-packages.py)
          # With no names, spack audit would check every builtin package
          if [ -z "${pkgs}" ]; then
            echo "::error::No packages found in the ukri_bench repository"
            exit 1
          fi
          echo "PKGS=${pkgs}" >> "${GITHUB_ENV}"

      - name: Audit
        run: |
          read -ra pkgs <<< "${PKGS}"
          spack audit configs
          spack audit packages "${pkgs[@]}"
          spack audit packages-https "${pkgs[@]}"

      - name: Check version tags
        # Only the default versions are fetched by the build workflows
        run: |
          read -ra pkgs <<< "${PKGS}"
          spack python .github/scripts/check-tags.py "${pkgs[@]}"

      - name: Create Spack environment
        run: |
          # The build workflows' environment, with each spec solved separately
          spack env create ci .github/spack/ci-env.yaml
          spack -e ci config add concretizer:unify:false
          # Concretizing does not need the build cache
          spack -e ci mirror remove ukri-bench-buildcache

      - name: Concretize
        run: |
          specs=(
            "bench-dolfinx"
            "bench-dolfinx@main"
            # GPU specs: keep in sync with build-bench-dolfinx.yml
            "bench-dolfinx +cuda cuda_arch=90"
            "bench-dolfinx +rocm amdgpu_target=gfx90a"
            "bench-dolfinx@main +cuda cuda_arch=90"
            "bench-dolfinx@main +rocm amdgpu_target=gfx90a"
            "nemo"
            "nemo config=BENCH +ice +pisces"
            "nemo ~mpi"
            "nemo +openmp"
            "nemo +openmp +openmp_offload openmp_flags=-fopenmp"
          )
          for spec in "${specs[@]}"; do
            spack -e ci add "${spec}"
          done
          # unify:false: the specs are solved independently, in parallel
          spack -e ci concretize -j "$(nproc)"

      - name: Check unsupported specs are rejected
        run: |
          # expect_fail <pattern> <spec...>: the spec must fail to concretize, with
          # an error matching the extended regex <pattern>
          expect_fail() {
            local pattern=$1 out
            shift
            if out=$(spack -e ci spec "$@" 2>&1); then
              printf '::error::spack spec %s concretized but should have failed\n' "$*"
              return 1
            fi
            if ! grep -Eq "${pattern}" <<< "${out}"; then
              printf '%s\n::error::spack spec %s failed for an unexpected reason\n' "${out}" "$*"
              return 1
            fi
            echo "ok: $* is rejected"
          }
          # Run the checks in parallel
          pids=()
          # Spack does not always report the conflict message for these
          expect_fail "both ROCm and CUDA|unsatisfiable" \
            bench-dolfinx +cuda +rocm cuda_arch=90 amdgpu_target=gfx90a & pids+=($!)
          expect_fail "CUDA architecture must be specified|unsatisfiable" \
            bench-dolfinx +cuda & pids+=($!)
          expect_fail "AMD GPU target must be specified|unsatisfiable" \
            bench-dolfinx +rocm & pids+=($!)
          expect_fail "XIOS spack package is currently broken" nemo +xios & pids+=($!)
          expect_fail "openmp_flags must be set" nemo +openmp +openmp_offload & pids+=($!)
          expect_fail "generic_config must be set" nemo config=GENERIC & pids+=($!)
          expect_fail "does not support PISCES" \
            nemo config=GOSI10p0.0_like_eORCA1 +pisces & pids+=($!)
          rc=0
          for pid in "${pids[@]}"; do
            wait "${pid}" || rc=1
          done
          exit "${rc}"
