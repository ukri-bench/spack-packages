name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  spack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Spack
        uses: ./.github/actions/setup-spack
        with:
          buildcache: false
      - name: Audit and concretize
        run: |
          spack audit packages bench-dolfinx nemo
          set -x
          spack spec bench-dolfinx
          spack spec bench-dolfinx +cuda cuda_arch=90
          spack spec bench-dolfinx +rocm amdgpu_target=gfx90a
          spack spec nemo
          spack spec nemo config=BENCH +ice +pisces
          spack spec nemo +openmp
          spack spec nemo +openmp +openmp_offload openmp_flags=-fopenmp
